apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s
spec:
  replicas: 2  # Number of pods
  selector:
    matchLabels:
      app: k8s
  template:
    metadata:
      labels:
        app: k8s
    spec:
      containers:
      - name: k8s
        image: k8s:latest #local
        imagePullPolicy: Never  # Tell Kubernetes not to pull from a registry
        # image: vikash95/kubernetes-test-app:latest ,from remote server
        resources:
          limits:
            memory: "64Mi"
            cpu: "200m"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: k8s
spec:
  selector:
    app: k8s
  ports:
  - port: 8080
    targetPort: 5000